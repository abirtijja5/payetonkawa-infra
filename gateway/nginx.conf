# Passerelle d'API (point d'entrée unique) devant les micro-services.
# - route chaque préfixe vers son service
# - répartit la charge entre les instances d'un même service (DNS Docker)
# - limite le nombre d'appels par IP et ajoute les en-têtes de sécurité

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;

    # DNS interne de Docker, résolu à chaque requête : si "product" a 3 instances,
    # les appels sont répartis entre elles (round-robin).
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    set $client_up client:8000;
    set $product_up product:8000;
    set $order_up order:8000;

    location /client/ {
        limit_req zone=api burst=40 nodelay;
        rewrite ^/client/(.*)$ /$1 break;
        proxy_pass http://$client_up;
    }
    location /product/ {
        limit_req zone=api burst=40 nodelay;
        rewrite ^/product/(.*)$ /$1 break;
        proxy_pass http://$product_up;
    }
    location /order/ {
        limit_req zone=api burst=40 nodelay;
        rewrite ^/order/(.*)$ /$1 break;
        proxy_pass http://$order_up;
    }

    # Les métriques ne sont pas exposées à l'extérieur
    location ~ /metrics { return 404; }

    location = / {
        default_type application/json;
        return 200 '{"clients":"/client/api/docs/","produits":"/product/api/docs/","commandes":"/order/api/docs/"}';
    }
}
